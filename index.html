@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{font-family:'DM Sans',system-ui,sans-serif;color:#f2f1ed;background:#0d111a;--fg:#f2f1ed;--muted:#9ba7b7;--lime:#c9f27e;--panel:#1a2230;--border:#354052}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#283d38,transparent 40%),#0d111a;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#0d111ae8;backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}.top{max-width:1150px;margin:auto;min-height:76px;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.logo{font-family:'Space Grotesk';font-size:19px;letter-spacing:2px;font-weight:700}.logo i{color:var(--lime);font-style:normal}.sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}.pill,.btn{border:1px solid #4e5a66;background:#242f3d;color:white;border-radius:12px;padding:11px 16px}.pill:hover,.btn:hover{border-color:var(--lime)}.primary{background:var(--lime);color:#16231d;border:0;font-weight:700}.wrap{max-width:1150px;margin:auto;padding:38px 22px 80px}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:3px;color:var(--lime);font-weight:700}h1{font-family:'Space Grotesk';font-size:clamp(34px,6vw,72px);line-height:1.04;margin:15px 0 18px;letter-spacing:-2px}h2{font-family:'Space Grotesk';font-size:26px;margin:0 0 12px}h3{font-size:18px;margin:0 0 12px}.lead{max-width:750px;color:#b4bdc9;line-height:1.8;font-size:16px}.bar{height:9px;background:#354050;border-radius:20px;overflow:hidden;margin-top:14px}.fill{height:100%;background:var(--lime);transition:.3s}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:34px 0 26px}.tab{border:1px solid var(--border);background:#18212d;color:#c1cbd7;padding:11px 18px;border-radius:50px}.tab.active{background:var(--lime);color:#121b14;border-color:var(--lime);font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}.card{background:linear-gradient(145deg,#202c37,#171e2a);border:1px solid var(--border);border-radius:19px;padding:23px;text-align:left;color:var(--fg);min-height:175px}.card:hover{transform:translateY(-2px);border-color:#889c74}.number{font-size:12px;letter-spacing:2px;color:var(--lime);margin-bottom:22px}.muted{color:var(--muted);line-height:1.65}.count{font-size:12px;color:#9cacb8}.stack{display:flex;gap:12px;flex-wrap:wrap}.panel{padding:24px;border:1px solid var(--border);background:#19222e;border-radius:19px;margin:18px 0}.back{background:transparent;color:var(--lime);border:0;padding:12px 0;margin-bottom:18px}.step{display:flex;gap:14px;line-height:1.65;padding:15px 0;border-bottom:1px solid var(--border)}.step .index{min-width:29px;height:29px;display:grid;place-items:center;background:#344333;border-radius:50%;color:var(--lime);font-size:13px}textarea,input[type=search]{width:100%;background:#101722;color:white;border:1px solid #465367;border-radius:13px;padding:14px;outline:0}textarea:focus,input:focus{border-color:var(--lime)}textarea{min-height:140px;resize:vertical}.label{color:var(--lime);font-size:12px;letter-spacing:2px;text-transform:uppercase}.note{font-size:12px;color:#93a1ad}.stat{color:var(--lime);font-weight:700;font-size:28px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.entry{border-bottom:1px solid var(--border);padding:18px 0}.entry small{color:var(--muted)}.timer{font:700 50px 'Space Grotesk';color:var(--lime);margin:14px 0}.iconlink{color:var(--lime);text-decoration:none}@media(max-width:650px){.two{grid-template-columns:1fr}.top{align-items:flex-start}.wrap{padding:25px 15px 65px}.card{min-height:145px}h1{letter-spacing:-1px}.tabs{margin-top:24px}}
.reading{font-size:16px;line-height:1.85;color:#d3dce7}.journey{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:17px}.journey div{display:flex;flex-direction:column;gap:7px;background:#111b26;border:1px solid #344052;padding:17px;border-radius:12px}.journey b{font-size:13px;color:#c9f27e}.journey span{font-size:12px;color:#b4bdc9;line-height:1.6}.field{margin:18px 0}.field textarea{margin-top:9px;min-height:88px}.inner{background:#101b27;margin-top:24px}.card h3{line-height:1.35}</style></head><body><header><div class="top"><div><div class="logo">REALITY <i>TRANSURFING</i></div><div class="sub">Academia · Cinco volúmenes · Oráculo</div></div><button class="pill" onclick="app('diario')">Mi diario ↗</button></div></header><main class="wrap" id="root"></main>
<script>const D={"chapters":[{"title":"Modelo de las variantes","subtitle":"Elegir conscientemente entre posibilidades.","theory":"La idea de Zeland es que una situación admite escenarios diferentes. El espacio de las variantes es su modelo metafísico, no un hecho científicamente demostrado. Utilízalo para flexibilizar la perspectiva y decidir cómo actuar."},{"title":"Péndulos","subtitle":"Reconocer qué absorbe tu atención y dejar de alimentarlo.","theory":"Zeland llama péndulos a estructuras colectivas que atraen pensamientos, emociones y conductas. Puede trabajarse como una metáfora de la presión social, la reacción automática y el conflicto."},{"title":"Ola de la suerte","subtitle":"Reconocer oportunidades y sostener la atención en lo favorable.","theory":"En el libro, la ola de la suerte es una metáfora de circunstancias favorables. En la práctica puedes entrenar la atención a lo útil sin negar problemas ni asumir causalidad mágica."},{"title":"Equilibrio","subtitle":"Reducir la importancia excesiva para actuar con soltura.","theory":"Zeland describe los potenciales excesivos como valoraciones cargadas de demasiada importancia. Su explicación energética forma parte de su propuesta; el ejercicio práctico consiste en reducir rigidez y dependencia."},{"title":"Transición inducida","subtitle":"Evitar cadenas de reacciones negativas.","theory":"El autor llama transición inducida al desplazamiento hacia una línea desfavorable tras engancharse a información o emociones negativas. Podemos practicarlo distinguiendo datos, pronósticos y decisiones."},{"title":"Corriente de las variantes","subtitle":"Combinar observación, intuición y acción deliberada.","theory":"La corriente de las variantes invita a abandonar el control rígido y prestar atención a alternativas. Las interpretaciones de señales son propuestas del autor; conviene contrastarlas con hechos y criterio propio."}],"practices":[{"id":"p01","c":0,"title":"Mapa de posibilidades","steps":["Elige una situación que hoy te preocupe","Escribe el desenlace que das por hecho","Anota tres alternativas plausibles","Elige una que quieras favorecer y una acción concreta"]},{"id":"p02","c":0,"title":"Escenario y decorados","steps":["Describe qué hechos son reales y cuáles interpretaciones","Separa las circunstancias de tu forma de reaccionar","Imagina cómo cambiarías tu papel","Anota un gesto coherente"]},{"id":"p03","c":0,"title":"Elegir frente a luchar","steps":["Identifica dónde estás forzando el resultado","Formula qué quieres de forma positiva","Separa las acciones que dependen de ti","Haz una sin exigir un desenlace"]},{"id":"p04","c":0,"title":"Elige tu actitud del día","steps":["Describe cómo quieres estar hoy","Anticipa una situación difícil","Elige una respuesta deliberada","Revísala al terminar el día"]},{"id":"p05","c":1,"title":"Detecta tus péndulos","steps":["Haz una lista de tres asuntos que capturan tu atención","Marca cuáles no has elegido libremente","Observa cómo te afectan","Decide cuál dejar de alimentar"]},{"id":"p06","c":1,"title":"Los hilos que me mueven","steps":["Recuerda un momento de reacción automática","Identifica miedo, culpa, orgullo o necesidad de aprobación","Describe qué hiciste","Elige una respuesta más libre"]},{"id":"p07","c":1,"title":"No alimentar la polémica","steps":["Identifica una discusión recurrente","Describe qué te activa","Evita repasarla durante unos minutos","Redirige tu atención a una tarea elegida"]},{"id":"p08","c":1,"title":"Aceptar y soltar","steps":["Nombra algo que te desagrada","Reconoce que existe aunque no lo apruebes","Deja de discutir mentalmente con ello","Elige dónde dirigir tu energía"]},{"id":"p09","c":1,"title":"Retirada suave","steps":["Imagina una petición conflictiva","Escucha sin discutir de entrada","Formula una pregunta práctica","Propón una alternativa con serenidad"]},{"id":"p10","c":1,"title":"Romper el guion","steps":["Reconoce una reacción repetitiva","Piensa una respuesta inesperada pero segura","Practícala mentalmente","Úsala en una situación de bajo riesgo"]},{"id":"p11","c":1,"title":"Del enfado al juego","steps":["Piensa en una pequeña molestia","Observa la tensión que provoca","Introduce humor o una mirada distinta","Elige si necesitas actuar o soltar"]},{"id":"p12","c":1,"title":"Visualización benéfica","steps":["Piensa en alguien con quien exista tensión","Imagina qué necesidad podría estar detrás","Visualízalo con esa necesidad atendida","Observa si cambia tu actitud sin esperar controlar a nadie"]},{"id":"p13","c":1,"title":"Alquílate: observa y actúa","steps":["Describe una tarea que te absorbe","Obsérvate como si fueras un testigo","Realízala con atención y sin dramatizar","Registra qué cambia"]},{"id":"p14","c":1,"title":"Mi péndulo elegido","steps":["Haz una lista de grupos y proyectos en tu vida","Distingue obligación de elección","Elige dónde sí quieres participar","Establece un límite de energía"]},{"id":"p15","c":2,"title":"Encuentra la ola","steps":["Recuerda algo bueno reciente","Describe cómo reaccionaste","Piensa qué oportunidades abrió","Elige una manera de aprovecharlo"]},{"id":"p16","c":2,"title":"Del bumerán al foco","steps":["Registra una preocupación repetitiva","Escribe qué deseas realmente","Formula un pensamiento orientado a la acción","Ponlo en práctica"]},{"id":"p17","c":2,"title":"Registrar señales favorables","steps":["Busca tres hechos positivos verificables","Apunta por qué son valiosos","Diferencia hechos de interpretaciones","Vuelve a leerlos al cerrar el día"]},{"id":"p18","c":2,"title":"Transmitir un buen estado","steps":["Elige una interacción cotidiana","Actúa con amabilidad auténtica","Observa el efecto real sin atribuir magia","Anota lo ocurrido"]},{"id":"p19","c":2,"title":"Ritual de inicio consciente","steps":["Detente un minuto","Recuerda un logro reciente","Formula una intención realista para hoy","Comienza una acción coherente"]},{"id":"p20","c":3,"title":"Detector de importancia","steps":["Elige algo que te preocupa","Puntúa su importancia del 1 al 10","Anota el temor que hay detrás","Escribe cómo actuarías si bajara dos puntos"]},{"id":"p21","c":3,"title":"Reducir la autoexigencia","steps":["Escribe una exigencia rígida","Reformula una versión suficiente","Identifica la tarea mínima útil","Realízala sin revisar compulsivamente"]},{"id":"p22","c":3,"title":"Soltar la dependencia","steps":["Identifica un resultado del que depende tu tranquilidad","Distingue deseo y necesidad","Piensa cómo te cuidarías si tarda","Toma una acción sin aferrarte"]},{"id":"p23","c":3,"title":"Desidealizar con cariño","steps":["Elige algo que has puesto en un pedestal","Escribe cualidades reales y limitaciones","Acepta ambas","Decide cómo relacionarte sin extremos"]},{"id":"p24","c":3,"title":"Salir de la comparación","steps":["Recuerda una comparación que te hizo daño","Identifica tu criterio de éxito","Reconoce tu punto de partida","Anota tu siguiente paso"]},{"id":"p25","c":3,"title":"Querer sin aferrarte","steps":["Formula algo que deseas","Reconoce lo que no controlas","Define una acción a tu alcance","Permítete disfrutar del presente"]},{"id":"p26","c":3,"title":"Culpa o responsabilidad","steps":["Describe una situación que te provoca culpa","Separa lo que hiciste de lo que imaginas","Reconoce qué puedes reparar","Planifica una acción proporcionada"]},{"id":"p27","c":3,"title":"Relación serena con el dinero","steps":["Observa una preocupación económica","Distingue números y suposiciones","Haz una acción financiera práctica","Revisa si has reducido la tensión"]},{"id":"p28","c":3,"title":"El permiso de ser imperfecto","steps":["Nombra un rasgo que rechazas","Reconoce cómo te condiciona","Formula una aceptación realista","Actúa sin esperar a cambiarlo"]},{"id":"p29","c":3,"title":"De la lucha al equilibrio","steps":["Identifica una batalla innecesaria","Anota el coste que tiene","Elige una salida o pausa","Haz algo que restablezca tu bienestar"]},{"id":"p30","c":4,"title":"Corta el embudo informativo","steps":["Observa qué noticias consumes","Elige una fuente y un tiempo limitado","Evita repasar titulares en bucle","Decide una acción útil si procede"]},{"id":"p31","c":4,"title":"Historia o pronóstico","steps":["Escribe un miedo futuro","Subraya qué partes son hechos","Marca el resto como hipótesis","Anota una respuesta proporcionada"]},{"id":"p32","c":4,"title":"Ante noticias alarmantes","steps":["Haz una pausa antes de reaccionar","Comprueba la fuente y la relevancia","Distingue peligro real de anticipación","Decide informar, actuar o cerrar"]},{"id":"p33","c":4,"title":"Escasez: del miedo al plan","steps":["Identifica una preocupación de escasez","Haz inventario de recursos reales","Define un paso pequeño","Evalúa qué necesitas pedir o aprender"]},{"id":"p34","c":5,"title":"Escucha la intuición sin idealizarla","steps":["Formula una elección concreta","Observa tu respuesta emocional","Enumera los datos disponibles","Elige sin confundir intuición con certeza"]},{"id":"p35","c":5,"title":"Tres papeles, una elección","steps":["Describe un dilema","Escribe qué pide la razón","Escribe qué sientes o deseas","Busca una decisión viable"]},{"id":"p36","c":5,"title":"La vía de menor resistencia","steps":["Identifica una tarea atascada","Piensa si hay una ruta más sencilla","Prueba un paso alternativo","Valora el resultado"]},{"id":"p37","c":5,"title":"Señales sin superstición","steps":["Registra una coincidencia significativa","Describe el hecho sin interpretarlo aún","Anota explicaciones alternativas","Decide si merece alguna acción"]},{"id":"p38","c":5,"title":"Confort interior","steps":["Piensa en una decisión que te inquieta","Observa qué alternativa te deja más sereno","Comprueba si evita obligaciones necesarias","Da un paso responsable"]},{"id":"p39","c":5,"title":"Suelta el guion","steps":["Escribe tu plan ideal","Separa objetivo y detalles rígidos","Imagina dos rutas distintas","Mantente atento a nuevas opciones"]},{"id":"p40","c":5,"title":"El Celador: vuelve a despertar","steps":["Pon un temporizador de un minuto","Observa qué piensas y haces","Pregúntate si estás eligiendo o reaccionando","Vuelve a la acción con intención"]}]};let view='inicio',selected=0,filter='',tick=null,secs=60;
const storeKey='transurfing-v1';
function normalizeState(raw){
 const s=raw&&typeof raw==='object'&&!Array.isArray(raw)?{...raw}:{};
 for(const k of ['done','fav','entries','v2Done','extraCompleted','rtHistory'])if(!Array.isArray(s[k]))s[k]=[];
 s.entries=s.entries.filter(x=>x&&typeof x==='object'&&!Array.isArray(x));
 s.rtHistory=s.rtHistory.filter(x=>x&&typeof x==='object'&&!Array.isArray(x)&&Number.isSafeInteger(x.timestamp)&&x.timestamp>0&&typeof x.id==='string');
 for(const k of ['done','fav','v2Done','extraCompleted'])s[k]=[...new Set(s[k].filter(x=>typeof x==='string'))];
 if(!s.rtDrafts||typeof s.rtDrafts!=='object'||Array.isArray(s.rtDrafts))s.rtDrafts={};
 const o=s.oracle&&typeof s.oracle==='object'&&!Array.isArray(s.oracle)?{...s.oracle}:{};
 for(const k of ['completed','favorites','consultations'])if(!Array.isArray(o[k]))o[k]=[];
 o.completed=[...new Set(o.completed.filter(n=>Number.isSafeInteger(n)&&n>=1&&n<=78))];
 o.favorites=[...new Set(o.favorites.filter(n=>Number.isSafeInteger(n)&&n>=1&&n<=78))];
 o.consultations=o.consultations.filter(x=>x&&typeof x==='object'&&!Array.isArray(x));
 o.day=Number.isSafeInteger(o.day)?Math.max(1,Math.min(78,o.day)):1;
 s.oracle=o;
 return s;
}
let state;try{state=normalizeState(JSON.parse(localStorage.getItem(storeKey)))}catch(e){state=normalizeState(null)}
function persist(){localStorage.setItem(storeKey,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function app(v,id){if(id!==undefined)selected=id;view=v;filter='';render();window.scrollTo({top:0,behavior:'smooth'})}
function setFilter(v){filter=v;renderCards()}
function done(id){if(!state.done.includes(id))state.done.push(id);else state.done=state.done.filter(x=>x!==id);persist();render()}
function fav(id){if(!state.fav.includes(id))state.fav.push(id);else state.fav=state.fav.filter(x=>x!==id);persist();render()}
function saveNote(){let value=document.getElementById('reflection')?.value.trim();if(!value)return;let p=D.practices[selected];state.entries.unshift({id:p.id,title:p.title,text:value,date:new Date().toLocaleString('es-ES')});persist();document.getElementById('reflection').value='';document.getElementById('saved').textContent='Reflexión guardada en tu diario.'}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='transurfing-diario.json';a.click();URL.revokeObjectURL(url)}
function timer(){clearInterval(tick);secs=60;const el=document.getElementById('clock');el.textContent='01:00';tick=setInterval(()=>{secs--;el.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');if(secs<=0)clearInterval(tick)},1000)}
function chapterCard(c,i){let num=D.practices.filter(x=>x.c===i).length;return '<button class="card" onclick="app(\'capitulo\','+i+')"><div class="number">CAPÍTULO '+String(i+1).padStart(2,'0')+'</div><h3>'+esc(c.title)+'</h3><div class="muted">'+esc(c.subtitle)+'</div><p class="count">'+num+' prácticas →</p></button>'}
function practiceCard(p,i){return '<button class="card" onclick="app(\'practica\','+i+')"><div class="number">'+String(p.c+1).padStart(2,'0')+' / '+p.id.toUpperCase()+' '+(state.done.includes(p.id)?' · ✓ REALIZADA':'')+'</div><h3>'+esc(p.title)+'</h3><div class="count">'+esc(D.chapters[p.c].title)+' →</div></button>'}
function renderCards(){const q=filter.toLowerCase();const arr=D.practices.map((p,i)=>({p,i})).filter(({p})=>p.title.toLowerCase().includes(q)||D.chapters[p.c].title.toLowerCase().includes(q));document.getElementById('results').innerHTML=arr.map(({p,i})=>practiceCard(p,i)).join('')||'<p class="muted">No hay prácticas con ese término.</p>'}

const E={"lessons":[[["El espacio de las variantes","Zeland propone imaginar la realidad como un conjunto de posibilidades que incluyen escenarios y decorados distintos. Lo presenta como una estructura de información que abarcaría acontecimientos pasados, presentes y futuros. Es el modelo metafísico del libro, no una descripción demostrada del universo.","Tu trabajo puede seguir igual, cambiar de responsabilidades o llevarte a otro equipo: son escenarios que puedes contemplar antes de decidir.","No necesitas creer en universos paralelos para usar este capítulo. Pregúntate qué posibilidades estás ignorando.","Mapa de posibilidades"],["Escenario, decorados y líneas de la vida","El escenario es la secuencia de acontecimientos; los decorados son las circunstancias en las que transcurre. Una línea de vida agrupa variantes parecidas. El autor utiliza estas imágenes para invitarte a elegir una dirección, en lugar de obsesionarte con modificar cada detalle de la situación actual.","En una discusión de pareja, el decorado puede ser la misma casa, pero el escenario cambia según cómo respondas a una petición.","Dibuja dos escenarios: el que repites por costumbre y uno que preferirías ensayar.","Escenario y decorados"],["Elegir es distinto de desear","Una diferencia recurrente del volumen I es que desear algo intensamente no equivale a elegir. El autor habla de adoptar una dirección con convicción y dejar de luchar contra todo lo que no encaja. En el terreno práctico, esa elección se concreta en decisiones y conductas.","Desear cambiar de trabajo es distinto de actualizar tu currículo y empezar a explorar ofertas.","Formúlalo así: «Elijo orientar mis decisiones hacia…». Luego concreta el primer paso verificable.","Elegir frente a luchar"],["La mirada del Celador","El Celador es una imagen del observador interior que recuerda lo que está sucediendo y puede interrumpir el piloto automático. En lugar de enfadarte por haberte distraído, te das cuenta y vuelves a elegir.","En cuanto notas que estás discutiendo mentalmente con alguien que ni siquiera está presente, has recuperado por un momento la observación.","Pon tres recordatorios suaves durante el día y pregúntate: «¿Estoy eligiendo o reaccionando?».","Elige tu actitud del día"]],[["Qué es un péndulo","En el libro, un péndulo surge cuando muchas personas orientan su atención y acción en una misma dirección; Zeland le atribuye una naturaleza energética independiente. Podemos usar esta figura para estudiar dinámicas colectivas que imponen reglas, rivalidades u objetivos.","Un debate interminable en redes puede absorber horas incluso cuando solo participas para criticarlo.","Busca cuándo una conversación o grupo te arrastra a un comportamiento que no habías elegido.","Detecta tus péndulos"],["Los hilos de la marioneta","El autor enumera miedo, culpa, indignación, orgullo, necesidad de aprobación y costumbres reactivas entre los modos de quedar enganchado. El punto práctico es reconocer la reacción automática antes de actuar.","Cuando alguien critica tu trabajo, quizá sientas la obligación de demostrar inmediatamente que tienes razón.","Nombra el detonante, la emoción y la respuesta habitual. Después diseña una alternativa.","Los hilos que me mueven"],["Hundimiento: dejar de luchar","Hundimiento significa reconocer que una situación existe y retirar la atención que dedicas a combatirla mentalmente. No exige aprobación ni pasividad ante un daño real; significa no alimentar una polémica innecesaria.","Si un comentario desagradable no requiere respuesta, puedes continuar con tu tarea en vez de reconstruir la conversación veinte veces.","Pregunta: «¿Esto necesita una acción, un límite o puedo soltarlo?».","No alimentar la polémica"],["Retirada suave","Cuando no puedes evitar una demanda, Zeland propone escuchar y redirigir con calma, sin responder al primer impulso de oposición. Esto no sustituye la comunicación asertiva ni obliga a acceder a peticiones injustas.","Tu responsable plantea un plazo imposible. Puedes preguntar por prioridades y recursos antes de discutir sobre quién tiene la culpa.","Ensaya una frase: «Entiendo la urgencia. ¿Qué podemos aplazar para hacerlo bien?».","Retirada suave"],["Extinción: romper el guion","Extinguir consiste en no reproducir la reacción esperada. El autor propone humor, cambio de perspectiva y respuestas inesperadas. Debe reservarse para situaciones seguras: nunca como consejo de confrontación ante amenazas.","Ante un pequeño atasco, cambiar la queja por curiosidad o humor puede interrumpir tu propia escalada.","Piensa una respuesta distinta que sea respetuosa, no agresiva y compatible con tus límites.","Romper el guion"],["Visualización benéfica","Zeland propone imaginar a una persona conflictiva satisfecha o tranquila. Su explicación energética no está demostrada; la práctica puede servir para reducir la hostilidad y ensayar una actitud menos reactiva.","Antes de una reunión tensa, imagina a la otra persona tranquila y con sus preocupaciones atendidas.","No lo uses para predecir o controlar su conducta. Observa únicamente tu propia disposición.","Visualización benéfica"],["Alquílate: actuar como observador","«Alquílate» es una expresión del autor para actuar con responsabilidad, pero sin entregar toda tu energía emocional a una tarea o conflicto. Sigues cumpliendo lo que te corresponde.","Haces una gestión incómoda y mantienes la atención en los pasos, en vez de convertir el resultado en un juicio sobre tu valía.","Haz bien la tarea. Suelta la dramatización añadida.","Alquílate: observa y actúa"],["No quedar en suspenso","Después de alejarte de dinámicas ajenas, necesitas elegir proyectos propios. El capítulo advierte que vaciar la agenda de conflictos no basta para dar dirección a la vida.","Reducir discusiones inútiles puede dejarte más tiempo; decide si lo dedicarás a una amistad, un proyecto o descansar.","Elige conscientemente una actividad que merezca tu implicación.","Mi péndulo elegido"]],[["La ola de la suerte","La ola de la suerte representa una acumulación de circunstancias favorables. Zeland sostiene que la actitud ante un primer acontecimiento influye en el camino posterior. Podemos utilizar esta imagen para entrenar atención y disposición a aprovechar oportunidades.","Una conversación inesperada te ofrece un contacto útil. Lo recuerdas y escribes a esa persona, en vez de olvidarlo al día siguiente.","Anota una oportunidad real y qué podrías hacer con ella.","Encuentra la ola"],["El bumerán de los pensamientos","El autor afirma que la orientación mental vuelve en forma de circunstancias. Esa relación causal no está demostrada. Como ejercicio, distinguir lo que repetimos mentalmente de lo que hacemos puede ayudarnos a cambiar la atención y la conducta.","«Siempre me saldrá mal» puede llevarte a evitar preparar una entrevista. Cambiar el foco puede permitirte practicar.","No te culpes por pensamientos negativos ni por sucesos difíciles. Elige una respuesta útil.","Del bumerán al foco"],["Transmisión de lo favorable","La propuesta es dar atención a lo positivo y mantener viva la experiencia de gratitud. En práctica, registra hechos buenos sin negar los inconvenientes ni obligarte a sentir alegría.","Hoy alguien te ha ayudado, has descansado bien o has cerrado un pendiente pequeño.","Registra hechos concretos, sin buscar señales ocultas en todo.","Registrar señales favorables"],["Los ritos como recordatorios","Zeland describe pequeños ritos y los interpreta como una forma de sintonizarse con una dirección. Un gesto repetido puede servir de recordatorio, pero no garantiza ningún resultado externo.","Antes de empezar a trabajar, abres una página del diario y escribes tu intención de hoy.","Elige un ritual sencillo, seguro y breve que te ayude a pasar a la acción.","Ritual de inicio consciente"]],[["Potenciales excesivos","Según Zeland, atribuir demasiada importancia a algo crea un potencial que desencadena fuerzas equiponderantes. Esa explicación energética pertenece a su modelo. En la práctica, observa cómo la presión puede entorpecer tu respuesta.","Una presentación relevante se convierte en «si sale mal, seré un fracaso». La tensión se dispara.","Separa la importancia real de la valoración absoluta que estás añadiendo.","Detector de importancia"],["Descontento y reprobación","El capítulo examina la crítica continua hacia uno mismo y el entorno. Su propuesta es dejar de añadir una condena global a aquello que no nos gusta, sin renunciar a cambiar lo modificable.","«He cometido un error» puede ser útil. «Soy incapaz de hacer nada bien» rara vez ayuda.","Describe un hecho sin convertirlo en una etiqueta permanente.","El permiso de ser imperfecto"],["Dependencia, idealización y sobrevaloración","Cuando tu bienestar depende por completo de una persona, un trabajo o un resultado, aumenta la rigidez. Zeland propone reducir esa importancia y reconocer que existen alternativas.","Quieres que una persona te responda. Puedes expresar tu interés y continuar con tu día.","Mantén el deseo y recupera otras fuentes de bienestar.","Soltar la dependencia"],["Superioridad, inferioridad y comparación","El autor relaciona los juicios de superioridad o inferioridad con pérdida de equilibrio. La práctica consiste en abandonar la comparación como medida constante de tu valor.","Un compañero recibe un ascenso: puedes alegrarte o aprender algo sin convertirlo en prueba de que tú vales menos.","Elige criterios propios y acciones observables.","Salir de la comparación"],["Deseo de tener o no tener","Cuanto más dependes de conseguir o evitar un resultado, más espacio ocupa. La salida práctica es reconocer el deseo, planificar acciones razonables y tolerar la incertidumbre.","Quieres aprobar una oposición. Estudiar tiene sentido; revisar constantemente si serías feliz al suspender no ayuda.","Redacta tu deseo y dos pasos realistas; añade un plan para cuidarte mientras tanto.","Querer sin aferrarte"],["Culpa, responsabilidad y reparación","Zeland cuestiona la culpa como herramienta de sometimiento. Conviene distinguir una culpa inducida de la responsabilidad real: hay situaciones en las que disculparse o reparar es apropiado.","Olvidaste una cita: puedes pedir disculpas y reprogramarla sin dedicar una semana a castigarte.","Pregunta qué corresponde reparar y qué parte es autocastigo inútil.","Culpa o responsabilidad"],["Dinero e importancia","El capítulo habla de la relación emocional con el dinero y de reducir su carga simbólica. No sustituye presupuestos, decisiones financieras ni la atención a necesidades materiales reales.","Temer mirar la cuenta no mejora el saldo; revisarlo y planificar ingresos y gastos sí permite decidir.","Haz una comprobación económica concreta, sin convertir tu situación en un juicio personal.","Relación serena con el dinero"],["De la lucha al equilibrio","La propuesta final del capítulo es actuar con determinación y menos tensión añadida. Soltar la lucha no significa abandonar límites, responsabilidades o acciones necesarias.","Una conversación pendiente puede resolverse mejor con preparación y claridad que ensayando mentalmente una batalla.","Elige qué merece acción y qué merece descanso.","De la lucha al equilibrio"]],[["Cómo comienza la transición inducida","Zeland describe una cadena: un acontecimiento provoca alarma, la atención se fija en él y cada nueva información parece confirmar el peor escenario. Su interpretación de líneas de vida es metafísica; la espiral de atención es observable.","Lees una noticia inquietante, consultas diez titulares similares y terminas imaginando el peor desenlace.","Registra cuándo dejaste de informarte y empezaste a alimentar la inquietud.","Corta el embudo informativo"],["Embudo del péndulo","El embudo representa cómo la repetición de mensajes y las reacciones colectivas estrechan la perspectiva. El libro incluye ejemplos de catástrofes, guerras, desempleo, epidemias y pobreza.","Una alarma económica general puede llevarte a interpretar cualquier gasto como la señal de una catástrofe personal.","Contrasta datos, identifica tu situación concreta y decide una medida proporcionada.","Historia o pronóstico"],["Catástrofe, guerra y epidemia","El autor analiza la reacción emocional a sucesos amenazantes. La práctica responsable es informarse bien, seguir medidas de seguridad y evitar exposición innecesaria a rumores. La atención negativa no causa catástrofes ni enfermedades.","Si hay una alerta sanitaria, sigue información oficial y toma precauciones adecuadas; no necesitas leer rumores toda la noche.","Distingue protección real de exposición repetitiva a información alarmante.","Ante noticias alarmantes"],["Desempleo, pánico y pobreza","El libro presenta estos temas como ejemplos de espirales de miedo. Aplicado con criterio, conviene convertir la preocupación en inventarios, apoyos y planes concretos, sin responsabilizar a quien atraviesa dificultades.","Ante incertidumbre laboral, revisa gastos, recursos, contactos y ofertas, en lugar de dar por hecho que no habrá salida.","Enumera acciones que sí están bajo tu control y busca apoyo cuando sea necesario.","Escasez: del miedo al plan"]],[["El campo de información","Zeland considera que existe un campo que contiene información sobre posibilidades. Esta es una hipótesis metafísica de su modelo. La aplicación práctica es aprender a observar con una mente menos rígida.","Cuando solo ves dos salidas a un conflicto, detenerte permite formular una tercera.","Abre opciones sin asumir que has accedido a una fuente sobrenatural.","Tres papeles, una elección"],["Conocimientos «de ninguna parte»","El autor habla de intuiciones que aparecen cuando se reduce el esfuerzo mental. En la práctica puedes registrar intuiciones y contrastarlas después con hechos: una sensación no equivale a conocimiento infalible.","Te viene una idea durante un paseo. Puedes anotarla y comprobar si funciona.","Distingue intuición, deseo, temor y evidencia.","Escucha la intuición sin idealizarla"],["Moverse con la corriente","La corriente de las variantes invita a prestar atención a caminos que presentan menos fricción innecesaria. No significa que lo fácil sea siempre lo adecuado: algunas decisiones valiosas exigen esfuerzo.","Una gestión administrativa se atasca. En vez de insistir en el mismo formulario, consultas otra vía oficial.","Busca caminos alternativos sin abandonar el objetivo.","La vía de menor resistencia"],["Señales de guía","Zeland da importancia a acontecimientos que parecen orientar una decisión. Puedes tomarlos como invitación a reflexionar, pero una coincidencia no prueba que el universo envíe instrucciones.","Te cruzas varias veces con un anuncio de un curso. En lugar de asumir que es una señal, compruebas si te interesa, cuánto cuesta y qué ofrece.","Anota el hecho, tres explicaciones posibles y una decisión fundamentada.","Señales sin superstición"],["Soltar la situación","El capítulo termina invitando a dejar de imponer un guion rígido al mundo. Mantén tus objetivos, respeta a otras personas y adapta los medios a lo que realmente ocurre.","Quieres organizar un viaje; cambia el transporte por una avería. El objetivo de disfrutar puede mantenerse con otra ruta.","Escribe qué parte del plan es esencial y cuál puedes adaptar.","Suelta el guion"],["El Celador y la comodidad interior","La atención consciente permite notar qué decisiones te producen tranquilidad o rechazo. La comodidad interior es información subjetiva útil, pero conviene contrastarla con responsabilidades y datos.","Una propuesta laboral parece atractiva en papel, pero te inquietan sus horarios. Investigas antes de aceptar.","Escucha lo que sientes y comprueba los hechos.","Confort interior"]]],"examples":{"Mapa de posibilidades":"Piensa en un proyecto estancado: el resultado que temes no es el único posible. Escribe tres rutas realistas.","Detecta tus péndulos":"Ejemplo: lees discusiones de un grupo y acabas justificándote durante horas, aunque al principio ni pensabas intervenir.","Los hilos que me mueven":"Ejemplo: te critican y respondes inmediatamente para demostrar tu valor.","No alimentar la polémica":"Ejemplo: dejas de revisar una discusión de redes que no necesita una decisión tuya.","Retirada suave":"Ejemplo: ante una exigencia laboral, reconoces la petición y preguntas qué tarea se puede aplazar.","Romper el guion":"Ejemplo: transformas una molestia pequeña en una observación humorística sin burlarte de nadie.","Visualización benéfica":"Ejemplo: imaginas a una persona tensa descansada, para reducir tu propia predisposición hostil.","Alquílate: observa y actúa":"Ejemplo: preparas un informe con atención y sin convertir una corrección en una tragedia.","Mi péndulo elegido":"Ejemplo: eliges dedicar una tarde a un proyecto propio después de dejar de discutir sin fin.","Detector de importancia":"Ejemplo: «Si no me sale perfecto, todo habrá sido inútil» pasa a «Quiero hacerlo bien y puedo corregir errores».","Culpa o responsabilidad":"Ejemplo: reconoces un olvido, pides disculpas y lo reparas sin autocastigarte.","Señales sin superstición":"Ejemplo: una coincidencia te recuerda una opción; verificas si realmente te conviene.","El Celador: vuelve a despertar":"Ejemplo: notas que has pasado veinte minutos rumiando y eliges volver a lo que estás haciendo."},"lookup":{"Mapa de posibilidades":{"c":0,"i":0},"Escenario y decorados":{"c":0,"i":1},"Elegir frente a luchar":{"c":0,"i":2},"Elige tu actitud del día":{"c":0,"i":3},"Detecta tus péndulos":{"c":1,"i":0},"Los hilos que me mueven":{"c":1,"i":1},"No alimentar la polémica":{"c":1,"i":2},"Retirada suave":{"c":1,"i":3},"Romper el guion":{"c":1,"i":4},"Visualización benéfica":{"c":1,"i":5},"Alquílate: observa y actúa":{"c":1,"i":6},"Mi péndulo elegido":{"c":1,"i":7},"Encuentra la ola":{"c":2,"i":0},"Del bumerán al foco":{"c":2,"i":1},"Registrar señales favorables":{"c":2,"i":2},"Ritual de inicio consciente":{"c":2,"i":3},"Detector de importancia":{"c":3,"i":0},"El permiso de ser imperfecto":{"c":3,"i":1},"Soltar la dependencia":{"c":3,"i":2},"Salir de la comparación":{"c":3,"i":3},"Querer sin aferrarte":{"c":3,"i":4},"Culpa o responsabilidad":{"c":3,"i":5},"Relación serena con el dinero":{"c":3,"i":6},"De la lucha al equilibrio":{"c":3,"i":7},"Corta el embudo informativo":{"c":4,"i":0},"Historia o pronóstico":{"c":4,"i":1},"Ante noticias alarmantes":{"c":4,"i":2},"Escasez: del miedo al plan":{"c":4,"i":3},"Tres papeles, una elección":{"c":5,"i":0},"Escucha la intuición sin idealizarla":{"c":5,"i":1},"La vía de menor resistencia":{"c":5,"i":2},"Señales sin superstición":{"c":5,"i":3},"Suelta el guion":{"c":5,"i":4},"Confort interior":{"c":5,"i":5}}};
function lessonLink(c,i){return '<button class="card" onclick="app(\'leccion\','+c*100+i+')"><div class="number">LECCIÓN '+(i+1)+' / '+E.lessons[c].length+'</div><h3>'+esc(E.lessons[c][i][0])+'</h3><p class="muted">'+esc(E.lessons[c][i][1].slice(0,112))+'…</p></button>'}
function fullLesson(c,i){let v=E.lessons[c][i],pr=D.practices.findIndex(p=>p.title===v[4]);return '<button class="back" onclick="app(\'capitulo\','+c+')">← Volver al capítulo</button><div class="eyebrow">Lección '+(i+1)+' de '+E.lessons[c].length+' · '+esc(D.chapters[c].title)+'</div><h1>'+esc(v[0])+'</h1><div class="panel"><div class="label">Comprende</div><p class="reading">'+esc(v[1])+'</p></div><div class="panel"><div class="label">Ejemplo cotidiano</div><p class="reading">'+esc(v[2])+'</p></div><div class="panel"><div class="label">Llévalo a tu vida</div><p class="reading">'+esc(v[3])+'</p></div>'+(pr>=0?'<button class="btn primary" onclick="app(\'practica\','+pr+')">Practicar: '+esc(v[4])+' →</button>':'')+'<div class="panel"><p class="note">Esta lección explica con palabras propias una idea del volumen I. No reproduce literalmente el libro. Las interpretaciones energéticas y metafísicas pertenecen al modelo de su autor.</p></div>'}
function practiceContext(p){let hit=E.lookup[p.title], l=hit?E.lessons[hit.c][hit.i]:null;return {why:l?l[1]:D.chapters[p.c].theory,example:E.examples[p.title]||(l?l[2]:'Piensa en un caso reciente y concreto de tu vida, preferiblemente de poca intensidad. Describe qué pasó, qué pensaste y cómo actuaste.'),meaning:l?l[3]:'Al terminar, identifica una acción pequeña, realista y verificable que puedas ensayar en las próximas 24 horas.'}}
function chooseSituation(v){let q=v.toLowerCase();let candidates=D.practices.map((p,i)=>({p,i})).filter(({p})=>p.title.toLowerCase().includes(q)||D.chapters[p.c].title.toLowerCase().includes(q));return candidates.map(({p,i})=>practiceCard(p,i)).join('')||'<p class="muted">Prueba con palabras como péndulo, culpa, dinero, preocupación, señales, intuición o equilibrio.</p>'}
function journalEntry(p){let keys=['situacion','respuesta','alternativa','accion','revision'];let labels=['¿Qué situación concreta has identificado?','¿Qué pensabas o hacías habitualmente?','¿Qué respuesta distinta has elegido?','¿Qué pondrás en práctica durante las próximas 24 horas?','¿Qué ha pasado al revisarlo? (puedes rellenarlo más tarde)'];return keys.map((k,i)=>'<div class="field"><label class="label" for="f-'+k+'">'+labels[i]+'</label><textarea id="f-'+k+'" rows="2" placeholder="'+(i===0?'Describe hechos concretos, sin juzgarte...':'Escribe con tus palabras...')+'"></textarea></div>').join('')}
function saveStructured(){let p=D.practices[selected],fields={};['situacion','respuesta','alternativa','accion','revision'].forEach(k=>{fields[k]=document.getElementById('f-'+k)?.value.trim()||''});if(!Object.values(fields).some(Boolean)){alert('Escribe al menos una respuesta antes de guardarla.');return}state.entries.unshift({id:p.id,title:p.title,text:Object.entries(fields).filter(x=>x[1]).map(x=>({situacion:'Situación',respuesta:'Respuesta habitual',alternativa:'Alternativa elegida',accion:'Acción de 24 horas',revision:'Revisión'}[x[0]]+': '+x[1])).join('\n\n'),fields,date:new Date().toLocaleString('es-ES')});persist();document.getElementById('saved').textContent='Reflexión guardada en tu diario. Ya puedes marcar la práctica como realizada.'}

function render(){clearInterval(tick);let html='';let per=Math.round(state.done.length/D.practices.length*100);
if(view==='inicio'){html='<div class="eyebrow">Manual interactivo · Volumen I</div><h1>Aprende a elegir.<br>Practica cada día.</h1><p class="lead">Un recorrido práctico por el primer volumen de Reality Transurfing. Empieza por las lecciones para entender el lenguaje de Zeland y después lleva cada idea a tu vida con prácticas guiadas, ejemplos y un diario personal.</p><div class="panel"><div class="stack" style="justify-content:space-between;align-items:center"><div><div class="label">Tu recorrido</div><div class="stat">'+state.done.length+' / '+D.practices.length+'</div></div><div><div class="label">Completado</div><div class="stat">'+per+'%</div></div><button class="btn primary" onclick="app(\'capitulo\',0)">Empezar a aprender →</button><button class="btn" onclick="app(\'practica\','+(new Date().getDate()%40)+')">Práctica del día</button></div><div class="bar"><div class="fill" style="width:'+per+'%"></div></div></div><div class="panel"><div class="label">Cómo utilizar este cuaderno</div><div class="journey"><div><b>01 · Comprende</b><span>Lee la lección y sus ejemplos.</span></div><div><b>02 · Reconoce</b><span>Identifica el concepto en una situación tuya.</span></div><div><b>03 · Practica</b><span>Sigue los pasos sin tener que consultar el libro.</span></div><div><b>04 · Integra</b><span>Elige una acción para las próximas 24 horas.</span></div><div><b>05 · Revisa</b><span>Guarda lo sucedido y aprende de la experiencia.</span></div></div></div><h2>Recorrido por capítulos</h2><div class="grid">'+D.chapters.map(chapterCard).join('')+'</div><div class="panel"><h3>Lo que plantea Zeland y lo que podemos comprobar</h3><p class="muted">El espacio de las variantes, las emisiones mentales y las fuerzas energéticas son afirmaciones metafísicas del autor, sin demostración científica sólida. Aquí se explican como parte de su obra y se proponen actividades de observación y toma de decisiones. Tus pensamientos no causan desgracias, enfermedades ni las decisiones de otras personas.</p></div>'}

 class="btn" onclick="done(\''+p.id+'\')">'+(state.done.includes(p.id)?'✓ Realizada · Desmarcar':'Marcar como realizada ✓')+'</button><button class="btn" onclick="fav(\''+p.id+'\')">'+(state.fav.includes(p.id)?'★ Favorita':'☆ Guardar favorita')+'</button></div></div><div class="panel"><h3>Pausa del Celador</h3><p class="muted">Un minuto para observar si estás reaccionando automáticamente o eligiendo cómo actuar.</p><div class="timer" id="clock">01:00</div><button class="btn" onclick="timer()">Comenzar minuto</button></div><button class="btn" onclick="app(\'practica\','+((selected+1)%40)+')">Siguiente práctica →</button>'}

function importData(input){
 const file=input.files?.[0];if(!file)return;
 if(file.size>15*1024*1024){alert('La copia supera los 15 MB. Comprueba el archivo antes de importarlo.');input.value='';return}
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const incoming=JSON.parse(reader.result);
   if(!incoming||typeof incoming!=='object'||Array.isArray(incoming)||!Array.isArray(incoming.done)||!Array.isArray(incoming.entries)||!Array.isArray(incoming.fav))throw Error('Formato incompleto');
   const known1=new Set(D.practices.map(x=>x.id));
   const known2=new Set((window.rtVolume2||[]).flatMap(c=>c.lessons.map(x=>x.id)));
   const knownExtra=new Set((window.rtBooks||[]).flatMap(b=>b.chapters.flatMap((c,ci)=>c.topics.map((_,li)=>'v'+b.number+'-'+ci+'-'+li))));
   const knownHistory=new Set([...known1].map(x=>'v1-'+x).concat([...known2].map(x=>'v2-'+x),[...knownExtra]));
   const validateIds=(arr,valid)=>{if(arr!==undefined&&(!Array.isArray(arr)||arr.some(x=>typeof x!=='string'||!valid.has(x))))throw Error('Identificadores de actividad inválidos');return arr||[]};
   validateIds(incoming.done,known1);validateIds(incoming.fav,known1);
   validateIds(incoming.v2Done,known2);validateIds(incoming.extraCompleted,knownExtra);
   const records=Array.isArray(incoming.rtHistory)?incoming.rtHistory:[];
   if(incoming.rtHistory!==undefined&&!Array.isArray(incoming.rtHistory))throw Error('Historial inválido');
   if(records.some(x=>!x||typeof x!=='object'||!knownHistory.has(x.id)||!Number.isSafeInteger(x.timestamp)||x.timestamp<=0))throw Error('Sesiones inválidas');
   if(incoming.entries.some(x=>!x||typeof x!=='object'||typeof x.id!=='string'||typeof x.title!=='string'||typeof x.text!=='string'||typeof x.date!=='string'))throw Error('Entradas inválidas');
   const unique=(a,b)=>[...new Set([...(a||[]),...(b||[])])];
   const mergeObjects=(a,b,keyOf)=>{const map=new Map();for(const x of [...(a||[]),...(b||[])]){const k=keyOf(x);if(k&&!map.has(k))map.set(k,x)}return [...map.values()]};
   const previous=normalizeState(state),imported=normalizeState(incoming);
   const oldO=previous.oracle,newO=imported.oracle;
   const mergedHistory=mergeObjects(previous.rtHistory,records,x=>x.id+'|'+x.timestamp);
   const candidate=normalizeState({
    ...imported,...previous,
    done:unique(previous.done,incoming.done),fav:unique(previous.fav,incoming.fav),
    v2Done:unique(previous.v2Done,incoming.v2Done||[]),
    extraCompleted:unique(previous.extraCompleted,incoming.extraCompleted||[]),
    entries:mergeObjects(previous.entries,incoming.entries,x=>x.rtSessionKey||[x.id,x.date,x.text].join('|')),
    rtHistory:mergedHistory,
    rtDrafts:{...imported.rtDrafts,...previous.rtDrafts},
    oracle:{
     ...newO,...oldO,
     completed:unique(oldO.completed,newO.completed),
     favorites:unique(oldO.favorites,newO.favorites),
     consultations:mergeObjects(oldO.consultations,newO.consultations,x=>[x.date,x.question,(x.cards||[]).join(','),x.summary].join('|')),
     day:Math.max(oldO.day,newO.day)
    }
   });
   localStorage.setItem(storeKey,JSON.stringify(candidate));
   try{if(mergedHistory.length)localStorage.setItem('rt-study-history-v3',JSON.stringify(mergedHistory))}catch(e){/* El estado principal conserva el historial completo. */}
   state=candidate;input.value='';
   alert('Copia importada y combinada con tus datos actuales.');render();
  }catch(e){input.value='';alert('No se ha podido importar la copia: '+(e?.message||'error de almacenamiento')+'. No se han aplicado cambios a esta sesión.')}
 };
 reader.onerror=()=>{input.value='';alert('No se ha podido leer el archivo de copia.')};
 reader.readAsText(file);
}
render();</script><script src="oracle.js" defer></script><script src="volume2.js" defer></script><script src="volumes345.js" defer></script><script src="study-plus.js" defer></script><script src="source-guide.js" defer></script></body></html>
