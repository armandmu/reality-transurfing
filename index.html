<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d101b"><meta name="description" content="Cuaderno interactivo de Reality Transurfing I"><title>TRANSURFING · Cuaderno de práctica</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{font-family:'DM Sans',system-ui,sans-serif;color:#f2f1ed;background:#0d111a;--fg:#f2f1ed;--muted:#9ba7b7;--lime:#c9f27e;--panel:#1a2230;--border:#354052}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#283d38,transparent 40%),#0d111a;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#0d111ae8;backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}.top{max-width:1150px;margin:auto;min-height:76px;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.logo{font-family:'Space Grotesk';font-size:19px;letter-spacing:2px;font-weight:700}.logo i{color:var(--lime);font-style:normal}.sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}.pill,.btn{border:1px solid #4e5a66;background:#242f3d;color:white;border-radius:12px;padding:11px 16px}.pill:hover,.btn:hover{border-color:var(--lime)}.primary{background:var(--lime);color:#16231d;border:0;font-weight:700}.wrap{max-width:1150px;margin:auto;padding:38px 22px 80px}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:3px;color:var(--lime);font-weight:700}h1{font-family:'Space Grotesk';font-size:clamp(34px,6vw,72px);line-height:1.04;margin:15px 0 18px;letter-spacing:-2px}h2{font-family:'Space Grotesk';font-size:26px;margin:0 0 12px}h3{font-size:18px;margin:0 0 12px}.lead{max-width:750px;color:#b4bdc9;line-height:1.8;font-size:16px}.bar{height:9px;background:#354050;border-radius:20px;overflow:hidden;margin-top:14px}.fill{height:100%;background:var(--lime);transition:.3s}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:34px 0 26px}.tab{border:1px solid var(--border);background:#18212d;color:#c1cbd7;padding:11px 18px;border-radius:50px}.tab.active{background:var(--lime);color:#121b14;border-color:var(--lime);font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}.card{background:linear-gradient(145deg,#202c37,#171e2a);border:1px solid var(--border);border-radius:19px;padding:23px;text-align:left;color:var(--fg);min-height:175px}.card:hover{transform:translateY(-2px);border-color:#889c74}.number{font-size:12px;letter-spacing:2px;color:var(--lime);margin-bottom:22px}.muted{color:var(--muted);line-height:1.65}.count{font-size:12px;color:#9cacb8}.stack{display:flex;gap:12px;flex-wrap:wrap}.panel{padding:24px;border:1px solid var(--border);background:#19222e;border-radius:19px;margin:18px 0}.back{background:transparent;color:var(--lime);border:0;padding:12px 0;margin-bottom:18px}.step{display:flex;gap:14px;line-height:1.65;padding:15px 0;border-bottom:1px solid var(--border)}.step .index{min-width:29px;height:29px;display:grid;place-items:center;background:#344333;border-radius:50%;color:var(--lime);font-size:13px}textarea,input[type=search]{width:100%;background:#101722;color:white;border:1px solid #465367;border-radius:13px;padding:14px;outline:0}textarea:focus,input:focus{border-color:var(--lime)}textarea{min-height:140px;resize:vertical}.label{color:var(--lime);font-size:12px;letter-spacing:2px;text-transform:uppercase}.note{font-size:12px;color:#93a1ad}.stat{color:var(--lime);font-weight:700;font-size:28px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.entry{border-bottom:1px solid var(--border);padding:18px 0}.entry small{color:var(--muted)}.timer{font:700 50px 'Space Grotesk';color:var(--lime);margin:14px 0}.iconlink{color:var(--lime);text-decoration:none}@media(max-width:650px){.two{grid-template-columns:1fr}.top{align-items:flex-start}.wrap{padding:25px 15px 65px}.card{min-height:145px}h1{letter-spacing:-1px}.tabs{margin-top:24px}}
</style></head><body><header><div class="top"><div><div class="logo">REALITY <i>TRANSURFING</i></div><div class="sub">Volumen I · El espacio de las variantes</div></div><button class="pill" onclick="app('diario')">Mi diario ↗</button></div></header><main class="wrap" id="root"></main>
<script>const D={"chapters":[{"title":"Modelo de las variantes","subtitle":"Elegir conscientemente entre posibilidades.","theory":"La idea de Zeland es que una situación admite escenarios diferentes. El espacio de las variantes es su modelo metafísico, no un hecho científicamente demostrado. Utilízalo para flexibilizar la perspectiva y decidir cómo actuar."},{"title":"Péndulos","subtitle":"Reconocer qué absorbe tu atención y dejar de alimentarlo.","theory":"Zeland llama péndulos a estructuras colectivas que atraen pensamientos, emociones y conductas. Puede trabajarse como una metáfora de la presión social, la reacción automática y el conflicto."},{"title":"Ola de la suerte","subtitle":"Reconocer oportunidades y sostener la atención en lo favorable.","theory":"En el libro, la ola de la suerte es una metáfora de circunstancias favorables. En la práctica puedes entrenar la atención a lo útil sin negar problemas ni asumir causalidad mágica."},{"title":"Equilibrio","subtitle":"Reducir la importancia excesiva para actuar con soltura.","theory":"Zeland describe los potenciales excesivos como valoraciones cargadas de demasiada importancia. Su explicación energética forma parte de su propuesta; el ejercicio práctico consiste en reducir rigidez y dependencia."},{"title":"Transición inducida","subtitle":"Evitar cadenas de reacciones negativas.","theory":"El autor llama transición inducida al desplazamiento hacia una línea desfavorable tras engancharse a información o emociones negativas. Podemos practicarlo distinguiendo datos, pronósticos y decisiones."},{"title":"Corriente de las variantes","subtitle":"Combinar observación, intuición y acción deliberada.","theory":"La corriente de las variantes invita a abandonar el control rígido y prestar atención a alternativas. Las interpretaciones de señales son propuestas del autor; conviene contrastarlas con hechos y criterio propio."}],"practices":[{"id":"p01","c":0,"title":"Mapa de posibilidades","steps":["Elige una situación que hoy te preocupe","Escribe el desenlace que das por hecho","Anota tres alternativas plausibles","Elige una que quieras favorecer y una acción concreta"]},{"id":"p02","c":0,"title":"Escenario y decorados","steps":["Describe qué hechos son reales y cuáles interpretaciones","Separa las circunstancias de tu forma de reaccionar","Imagina cómo cambiarías tu papel","Anota un gesto coherente"]},{"id":"p03","c":0,"title":"Elegir frente a luchar","steps":["Identifica dónde estás forzando el resultado","Formula qué quieres de forma positiva","Separa las acciones que dependen de ti","Haz una sin exigir un desenlace"]},{"id":"p04","c":0,"title":"Elige tu actitud del día","steps":["Describe cómo quieres estar hoy","Anticipa una situación difícil","Elige una respuesta deliberada","Revísala al terminar el día"]},{"id":"p05","c":1,"title":"Detecta tus péndulos","steps":["Haz una lista de tres asuntos que capturan tu atención","Marca cuáles no has elegido libremente","Observa cómo te afectan","Decide cuál dejar de alimentar"]},{"id":"p06","c":1,"title":"Los hilos que me mueven","steps":["Recuerda un momento de reacción automática","Identifica miedo, culpa, orgullo o necesidad de aprobación","Describe qué hiciste","Elige una respuesta más libre"]},{"id":"p07","c":1,"title":"No alimentar la polémica","steps":["Identifica una discusión recurrente","Describe qué te activa","Evita repasarla durante unos minutos","Redirige tu atención a una tarea elegida"]},{"id":"p08","c":1,"title":"Aceptar y soltar","steps":["Nombra algo que te desagrada","Reconoce que existe aunque no lo apruebes","Deja de discutir mentalmente con ello","Elige dónde dirigir tu energía"]},{"id":"p09","c":1,"title":"Retirada suave","steps":["Imagina una petición conflictiva","Escucha sin discutir de entrada","Formula una pregunta práctica","Propón una alternativa con serenidad"]},{"id":"p10","c":1,"title":"Romper el guion","steps":["Reconoce una reacción repetitiva","Piensa una respuesta inesperada pero segura","Practícala mentalmente","Úsala en una situación de bajo riesgo"]},{"id":"p11","c":1,"title":"Del enfado al juego","steps":["Piensa en una pequeña molestia","Observa la tensión que provoca","Introduce humor o una mirada distinta","Elige si necesitas actuar o soltar"]},{"id":"p12","c":1,"title":"Visualización benéfica","steps":["Piensa en alguien con quien exista tensión","Imagina qué necesidad podría estar detrás","Visualízalo con esa necesidad atendida","Observa si cambia tu actitud sin esperar controlar a nadie"]},{"id":"p13","c":1,"title":"Alquílate: observa y actúa","steps":["Describe una tarea que te absorbe","Obsérvate como si fueras un testigo","Realízala con atención y sin dramatizar","Registra qué cambia"]},{"id":"p14","c":1,"title":"Mi péndulo elegido","steps":["Haz una lista de grupos y proyectos en tu vida","Distingue obligación de elección","Elige dónde sí quieres participar","Establece un límite de energía"]},{"id":"p15","c":2,"title":"Encuentra la ola","steps":["Recuerda algo bueno reciente","Describe cómo reaccionaste","Piensa qué oportunidades abrió","Elige una manera de aprovecharlo"]},{"id":"p16","c":2,"title":"Del bumerán al foco","steps":["Registra una preocupación repetitiva","Escribe qué deseas realmente","Formula un pensamiento orientado a la acción","Ponlo en práctica"]},{"id":"p17","c":2,"title":"Registrar señales favorables","steps":["Busca tres hechos positivos verificables","Apunta por qué son valiosos","Diferencia hechos de interpretaciones","Vuelve a leerlos al cerrar el día"]},{"id":"p18","c":2,"title":"Transmitir un buen estado","steps":["Elige una interacción cotidiana","Actúa con amabilidad auténtica","Observa el efecto real sin atribuir magia","Anota lo ocurrido"]},{"id":"p19","c":2,"title":"Ritual de inicio consciente","steps":["Detente un minuto","Recuerda un logro reciente","Formula una intención realista para hoy","Comienza una acción coherente"]},{"id":"p20","c":3,"title":"Detector de importancia","steps":["Elige algo que te preocupa","Puntúa su importancia del 1 al 10","Anota el temor que hay detrás","Escribe cómo actuarías si bajara dos puntos"]},{"id":"p21","c":3,"title":"Reducir la autoexigencia","steps":["Escribe una exigencia rígida","Reformula una versión suficiente","Identifica la tarea mínima útil","Realízala sin revisar compulsivamente"]},{"id":"p22","c":3,"title":"Soltar la dependencia","steps":["Identifica un resultado del que depende tu tranquilidad","Distingue deseo y necesidad","Piensa cómo te cuidarías si tarda","Toma una acción sin aferrarte"]},{"id":"p23","c":3,"title":"Desidealizar con cariño","steps":["Elige algo que has puesto en un pedestal","Escribe cualidades reales y limitaciones","Acepta ambas","Decide cómo relacionarte sin extremos"]},{"id":"p24","c":3,"title":"Salir de la comparación","steps":["Recuerda una comparación que te hizo daño","Identifica tu criterio de éxito","Reconoce tu punto de partida","Anota tu siguiente paso"]},{"id":"p25","c":3,"title":"Querer sin aferrarte","steps":["Formula algo que deseas","Reconoce lo que no controlas","Define una acción a tu alcance","Permítete disfrutar del presente"]},{"id":"p26","c":3,"title":"Culpa o responsabilidad","steps":["Describe una situación que te provoca culpa","Separa lo que hiciste de lo que imaginas","Reconoce qué puedes reparar","Planifica una acción proporcionada"]},{"id":"p27","c":3,"title":"Relación serena con el dinero","steps":["Observa una preocupación económica","Distingue números y suposiciones","Haz una acción financiera práctica","Revisa si has reducido la tensión"]},{"id":"p28","c":3,"title":"El permiso de ser imperfecto","steps":["Nombra un rasgo que rechazas","Reconoce cómo te condiciona","Formula una aceptación realista","Actúa sin esperar a cambiarlo"]},{"id":"p29","c":3,"title":"De la lucha al equilibrio","steps":["Identifica una batalla innecesaria","Anota el coste que tiene","Elige una salida o pausa","Haz algo que restablezca tu bienestar"]},{"id":"p30","c":4,"title":"Corta el embudo informativo","steps":["Observa qué noticias consumes","Elige una fuente y un tiempo limitado","Evita repasar titulares en bucle","Decide una acción útil si procede"]},{"id":"p31","c":4,"title":"Historia o pronóstico","steps":["Escribe un miedo futuro","Subraya qué partes son hechos","Marca el resto como hipótesis","Anota una respuesta proporcionada"]},{"id":"p32","c":4,"title":"Ante noticias alarmantes","steps":["Haz una pausa antes de reaccionar","Comprueba la fuente y la relevancia","Distingue peligro real de anticipación","Decide informar, actuar o cerrar"]},{"id":"p33","c":4,"title":"Escasez: del miedo al plan","steps":["Identifica una preocupación de escasez","Haz inventario de recursos reales","Define un paso pequeño","Evalúa qué necesitas pedir o aprender"]},{"id":"p34","c":5,"title":"Escucha la intuición sin idealizarla","steps":["Formula una elección concreta","Observa tu respuesta emocional","Enumera los datos disponibles","Elige sin confundir intuición con certeza"]},{"id":"p35","c":5,"title":"Tres papeles, una elección","steps":["Describe un dilema","Escribe qué pide la razón","Escribe qué sientes o deseas","Busca una decisión viable"]},{"id":"p36","c":5,"title":"La vía de menor resistencia","steps":["Identifica una tarea atascada","Piensa si hay una ruta más sencilla","Prueba un paso alternativo","Valora el resultado"]},{"id":"p37","c":5,"title":"Señales sin superstición","steps":["Registra una coincidencia significativa","Describe el hecho sin interpretarlo aún","Anota explicaciones alternativas","Decide si merece alguna acción"]},{"id":"p38","c":5,"title":"Confort interior","steps":["Piensa en una decisión que te inquieta","Observa qué alternativa te deja más sereno","Comprueba si evita obligaciones necesarias","Da un paso responsable"]},{"id":"p39","c":5,"title":"Suelta el guion","steps":["Escribe tu plan ideal","Separa objetivo y detalles rígidos","Imagina dos rutas distintas","Mantente atento a nuevas opciones"]},{"id":"p40","c":5,"title":"El Celador: vuelve a despertar","steps":["Pon un temporizador de un minuto","Observa qué piensas y haces","Pregúntate si estás eligiendo o reaccionando","Vuelve a la acción con intención"]}]};let view='inicio',selected=0,filter='',tick=null,secs=60;
const storeKey='transurfing-v1';let state;try{state=JSON.parse(localStorage.getItem(storeKey))||{done:[],fav:[],entries:[]}}catch(e){state={done:[],fav:[],entries:[]}};function persist(){localStorage.setItem(storeKey,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function app(v,id){if(id!==undefined)selected=id;view=v;filter='';render();window.scrollTo({top:0,behavior:'smooth'})}
function setFilter(v){filter=v;renderCards()}
function done(id){if(!state.done.includes(id))state.done.push(id);else state.done=state.done.filter(x=>x!==id);persist();render()}
function fav(id){if(!state.fav.includes(id))state.fav.push(id);else state.fav=state.fav.filter(x=>x!==id);persist();render()}
function saveNote(){let value=document.getElementById('reflection')?.value.trim();if(!value)return;let p=D.practices[selected];state.entries.unshift({id:p.id,title:p.title,text:value,date:new Date().toLocaleString('es-ES')});persist();document.getElementById('reflection').value='';document.getElementById('saved').textContent='Reflexión guardada en tu diario.'}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='transurfing-diario.json';a.click();URL.revokeObjectURL(url)}
function timer(){clearInterval(tick);secs=60;const el=document.getElementById('clock');el.textContent='01:00';tick=setInterval(()=>{secs--;el.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');if(secs<=0)clearInterval(tick)},1000)}
function chapterCard(c,i){let num=D.practices.filter(x=>x.c===i).length;return '<button class="card" onclick="app(\'capitulo\','+i+')"><div class="number">CAPÍTULO '+String(i+1).padStart(2,'0')+'</div><h3>'+esc(c.title)+'</h3><div class="muted">'+esc(c.subtitle)+'</div><p class="count">'+num+' prácticas →</p></button>'}
function practiceCard(p,i){return '<button class="card" onclick="app(\'practica\','+i+')"><div class="number">'+String(p.c+1).padStart(2,'0')+' / '+p.id.toUpperCase()+' '+(state.done.includes(p.id)?' · ✓ REALIZADA':'')+'</div><h3>'+esc(p.title)+'</h3><div class="count">'+esc(D.chapters[p.c].title)+' →</div></button>'}
function renderCards(){const q=filter.toLowerCase();const arr=D.practices.map((p,i)=>({p,i})).filter(({p})=>p.title.toLowerCase().includes(q)||D.chapters[p.c].title.toLowerCase().includes(q));document.getElementById('results').innerHTML=arr.map(({p,i})=>practiceCard(p,i)).join('')||'<p class="muted">No hay prácticas con ese término.</p>'}
function render(){clearInterval(tick);let html='';let per=Math.round(state.done.length/D.practices.length*100);
if(view==='inicio'){html='<div class="eyebrow">Cuaderno de exploración · Edición personal</div><h1>Elige tu forma<br>de responder.</h1><p class="lead">Una guía interactiva para estudiar y practicar las ideas del primer volumen de Vadim Zeland. Teoría explicada en lenguaje claro, 40 propuestas paso a paso, diario y seguimiento, sin necesidad de consultar el PDF para utilizar estas actividades.</p><div class="panel"><div class="stack" style="justify-content:space-between"><div><div class="label">Tu recorrido</div><div class="stat">'+state.done.length+' / 40</div></div><div><div class="label">Completado</div><div class="stat">'+per+'%</div></div><button class="btn primary" onclick="app(\'practica\','+(new Date().getDate()%40)+')">Práctica de hoy →</button></div><div class="bar"><div class="fill" style="width:'+per+'%"></div></div></div><h2>Los seis capítulos</h2><div class="grid">'+D.chapters.map(chapterCard).join('')+'</div><div class="panel"><h3>Una aclaración sobre el método</h3><p class="muted">El Transurfing incluye afirmaciones metafísicas que no cuentan con demostración científica. Aquí se presentan como las propuestas de Zeland, con ejercicios originales de aplicación personal. No son instrucciones literales ni una reproducción íntegra del libro.</p></div>'}
if(view==='capitulo'){let ch=D.chapters[selected];html='<button class="back" onclick="app(\'inicio\')">← Volver al inicio</button><div class="eyebrow">Capítulo '+String(selected+1).padStart(2,'0')+'</div><h1>'+esc(ch.title)+'</h1><p class="lead">'+esc(ch.theory)+'</p><div class="panel"><div class="label">Objetivo de la práctica</div><p>'+esc(ch.subtitle)+'</p></div><h2>Prácticas del capítulo</h2><div class="grid">'+D.practices.map((p,i)=>p.c===selected?practiceCard(p,i):'').join('')+'</div>'}
if(view==='practica'){let p=D.practices[selected],c=D.chapters[p.c];html='<button class="back" onclick="app(\'capitulo\','+p.c+')">← '+esc(c.title)+'</button><div class="eyebrow">Práctica '+p.id.toUpperCase()+' · '+esc(c.title)+'</div><h1>'+esc(p.title)+'</h1><p class="lead">'+esc(c.theory)+'</p><div class="panel"><h2>Guía paso a paso</h2>'+p.steps.map((s,i)=>'<div class="step"><span class="index">'+(i+1)+'</span><span>'+esc(s)+'</span></div>').join('')+'</div><div class="panel"><h3>Tu reflexión</h3><p class="muted">¿Qué has observado? ¿Qué acción concreta quieres probar? Puedes escribirlo con tus propias palabras.</p><textarea id="reflection" placeholder="Escribe aquí lo que has descubierto..."></textarea><p id="saved" class="note"></p><div class="stack"><button class="btn primary" onclick="saveNote()">Guardar reflexión</button><button class="btn" onclick="done(\''+p.id+'\')">'+(state.done.includes(p.id)?'✓ Realizada · Desmarcar':'Marcar como realizada ✓')+'</button><button class="btn" onclick="fav(\''+p.id+'\')">'+(state.fav.includes(p.id)?'★ Favorita':'☆ Guardar favorita')+'</button></div></div><div class="panel"><h3>Pausa del Celador</h3><p class="muted">Un minuto para observar cómo estás pensando y actuar con mayor intención.</p><div class="timer" id="clock">01:00</div><button class="btn" onclick="timer()">Comenzar minuto</button></div><div class="stack"><button class="btn" onclick="app(\'practica\','+((selected+1)%40)+')">Siguiente práctica →</button></div>'}
if(view==='biblioteca'){html='<h1>Biblioteca de prácticas</h1><p class="lead">Busca por concepto o recorre libremente las 40 propuestas.</p><input type="search" placeholder="Buscar ejercicios o capítulos..." oninput="setFilter(this.value)"><div id="results" class="grid" style="margin-top:22px"></div>'}
if(view==='favoritos'){html='<h1>Tus favoritas</h1><div class="grid">'+D.practices.map((p,i)=>state.fav.includes(p.id)?practiceCard(p,i):'').join('')+'</div>'+(state.fav.length?'':'<p class="muted">Aún no has marcado ninguna práctica.</p>')}
if(view==='diario'){html='<h1>Tu diario</h1><p class="lead">Tus notas se guardan en este navegador. No se envían a ningún servidor. Si cambias de dispositivo, tendrás que exportarlas.</p><div class="stack"><button class="btn primary" onclick="exportData()">Exportar mis datos ↓</button><button class="btn" onclick="document.getElementById(\'upload\').click()">Importar copia</button><input id="upload" type="file" accept="application/json" hidden onchange="importData(this)"></div><div class="panel"><div class="two"><div><div class="label">Prácticas realizadas</div><div class="stat">'+state.done.length+'</div></div><div><div class="label">Reflexiones guardadas</div><div class="stat">'+state.entries.length+'</div></div></div></div>'+state.entries.map(e=>'<div class="entry"><small>'+esc(e.date)+' · '+esc(e.title)+'</small><p style="white-space:pre-wrap">'+esc(e.text)+'</p></div>').join('')+(state.entries.length?'':'<p class="muted">Tus reflexiones aparecerán aquí cuando completes una práctica.</p>')}
document.getElementById('root').innerHTML=html+'<nav class="tabs"><button class="tab '+(view==='inicio'?'active':'')+'" onclick="app(\'inicio\')">Inicio</button><button class="tab '+(view==='biblioteca'?'active':'')+'" onclick="app(\'biblioteca\')">Todas las prácticas</button><button class="tab '+(view==='favoritos'?'active':'')+'" onclick="app(\'favoritos\')">Favoritas</button><button class="tab '+(view==='diario'?'active':'')+'" onclick="app(\'diario\')">Diario</button></nav><footer class="note">Guía de estudio independiente inspirada en Reality Transurfing I · Vadim Zeland. Ejercicios de adaptación propia.</footer>';if(view==='biblioteca')renderCards()}
function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!Array.isArray(v.done)||!Array.isArray(v.fav)||!Array.isArray(v.entries))throw Error();state=v;persist();render()}catch(e){alert('El archivo no contiene un diario válido.')}};r.readAsText(f)}
render();</script></body></html>
